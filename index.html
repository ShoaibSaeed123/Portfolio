<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoaib | MERN Developer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f172a;
  --card:rgba(255,255,255,0.05);
  --text:#e2e8f0;
  --muted:#94a3b8;

  /* NEW PREMIUM COLORS */
  --accent:#c084fc;   /* soft purple */
  --accent2:#f59e0b;  /* warm amber */
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter;
}

body{
  background:linear-gradient(to bottom,#0f172a,#020617);
  color:var(--text);
  overflow-x:hidden;
}

/* CURSOR */
.cursor-light{
  position:fixed;
  width:300px;
  height:300px;
  background:radial-gradient(circle, rgba(192,132,252,0.18), transparent 60%);
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:0;
  filter:blur(40px);
}

/* BG GLOW */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-2;
}

.bg span{
  position:absolute;
  width:400px;
  height:400px;
  background:radial-gradient(circle, rgba(192,132,252,0.12), transparent 70%);
  filter:blur(120px);
}

.bg span:nth-child(2){
  left:60%;
  top:50%;
  background:radial-gradient(circle, rgba(245,158,11,0.12), transparent 70%);
}

/* NAV */
header{
  position:fixed;
  width:100%;
  backdrop-filter:blur(15px);
  background:rgba(15,23,42,0.7);
  border-bottom:1px solid rgba(255,255,255,0.05);
  z-index:100;
}

nav{
  max-width:1200px;
  margin:auto;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

nav h3{
  font-size:1.4rem;
  color:#fff;
  letter-spacing:1px;
}

/* NAV LINKS */
.nav-links{
  display:flex;
}

nav a{
  color:var(--text);
  margin-left:25px;
  text-decoration:none;
  font-size:14px;
  position:relative;
}

nav a::after{
  content:"";
  position:absolute;
  bottom:-5px;
  left:0;
  width:0%;
  height:2px;
  background:var(--accent);
  transition:.3s;
}

nav a:hover::after{
  width:100%;
}

/* HAMBURGER */
.menu-btn{
  display:none;
  font-size:24px;
  cursor:pointer;
}

/* HERO */
.hero{
  min-height:100vh;
  max-width:1200px;
  margin:auto;
  padding:140px 20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.hero h1{
  font-size:3rem;
}

.hero h1 span{
  color:var(--accent);
}

.hero h2{
  margin:10px 0;
  color:var(--accent2);
  font-weight:500;
}

.hero p{
  color:var(--muted);
  line-height:1.7;
  max-width:500px;
}

/* BUTTONS */
.btn{
  display:inline-block;
  padding:12px 26px;
  border-radius:10px;
  margin-top:20px;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}

.primary{
  background:var(--accent);
  color:#020617;
}

.primary:hover{
  opacity:.85;
}

.outline{
  border:1px solid var(--accent);
  color:var(--accent);
  margin-left:10px;
}

.outline:hover{
  background:var(--accent);
  color:#020617;
}

/* IMAGE */
.hero img{
  width:100%;
  max-width:350px;
  border-radius:18px;
  justify-self:end;
}

/* TYPE */
.type{
  border-right:2px solid var(--accent);
  white-space:nowrap;
  overflow:hidden;
  width:0;
  animation:typing 3s steps(20,end) forwards, blink .7s infinite;
}

@keyframes typing{
  to{width:100%}
}
@keyframes blink{
  50%{border-color:transparent}
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#020617;
  padding:25px;
  border-radius:12px;
  width:90%;
  max-width:350px;
  text-align:center;
}

.modal-content a{
  display:block;
  margin:10px 0;
  padding:10px;
  background:var(--accent);
  color:#020617;
  border-radius:8px;
  text-decoration:none;
}

/* MOBILE */
@media(max-width:900px){
  .hero{
    grid-template-columns:1fr;
    text-align:center;
  }

  .hero img{
    justify-self:center;
  }

  .nav-links{
    position:absolute;
    top:70px;
    left:0;
    width:100%;
    background:#020617;
    flex-direction:column;
    display:none;
    text-align:center;
  }

  .nav-links a{
    margin:15px 0;
  }

  .nav-links.active{
    display:flex;
  }

  .menu-btn{
    display:block;
  }
}
</style>
</head>

<body>

<div class="cursor-light" id="cursor"></div>

<div class="bg">
  <span></span>
  <span></span>
</div>

<header>
  <nav>
    <h3>Shoaib</h3>

    <div class="nav-links" id="navLinks">
      <a href="skills.html">Skills</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
      <a href="experience.html">Experience</a>
      <a href="education.html">Education</a>
    </div>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>
  </nav>
</header>

<section class="hero">
  <div>
    <h1>Hi, I'm <span>Shoaib</span></h1>
    <h2 class="type">MERN Stack Developer</h2>
    <p>
      I build clean, scalable web applications with modern technologies and real-world performance in mind.
    </p>

    <a href="projects.html" class="btn primary">View Projects</a>
    <button class="btn outline" onclick="openCV()">Download CV</button>
  </div>

  <img src="Muhammad Shoaib saeed.png" alt="Shoaib">
</section>

<div class="modal" id="cvModal">
  <div class="modal-content">
    <h3>Download CV</h3>
    <a href="assets/Shoaib-CV.pdf" download>Download PDF</a>
    <button onclick="closeCV()" class="btn outline">Cancel</button>
  </div>
</div>

<script>
function openCV(){
  document.getElementById("cvModal").style.display="flex";
}

function closeCV(){
  document.getElementById("cvModal").style.display="none";
}

function toggleMenu(){
  document.getElementById("navLinks").classList.toggle("active");
}

/* CURSOR */
const cursor = document.getElementById("cursor");
document.addEventListener("mousemove",(e)=>{
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});
</script>

</body>
</html>
