<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoaib | MERN Developer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1120;
  --card:rgba(255,255,255,0.06);
  --text:#e5e7eb;
  --muted:#94a3b8;

  --accent:#60a5fa;
  --accent2:#34d399;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter;
}

body{
  background:linear-gradient(to bottom,#0b1120,#020617);
  color:var(--text);
  overflow-x:hidden;
}

/* ===== CURSOR LIGHT EFFECT ===== */
.cursor-light{
  position:fixed;
  width:350px;
  height:350px;
  background:radial-gradient(circle, rgba(96,165,250,0.25), transparent 60%);
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:0;
  filter:blur(30px);
  transition:0.05s;
}

/* ===== BACKGROUND GLOW ===== */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-2;
}

.bg span{
  position:absolute;
  width:500px;
  height:500px;
  background:radial-gradient(circle, rgba(96,165,250,0.18), transparent 70%);
  filter:blur(140px);
  animation:move 16s infinite alternate ease-in-out;
}

.bg span:nth-child(2){
  left:60%;
  top:50%;
  background:radial-gradient(circle, rgba(52,211,153,0.18), transparent 70%);
}

@keyframes move{
  to{transform:translate(200px,150px)}
}

/* ===== NAVBAR ===== */
header{
  position:fixed;
  width:100%;
  backdrop-filter:blur(20px);
  background:rgba(11,17,32,0.6);
  border-bottom:1px solid rgba(255,255,255,0.05);
  z-index:100;
}

nav{
  max-width:1200px;
  margin:auto;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

nav h3{
  font-size:1.5rem;
  background:linear-gradient(90deg,#60a5fa,#34d399);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

nav a{
  color:var(--text);
  margin-left:25px;
  text-decoration:none;
  position:relative;
  font-size:15px;
}

nav a::after{
  content:"";
  position:absolute;
  bottom:-5px;
  left:0;
  width:0%;
  height:2px;
  background:var(--accent);
  transition:0.3s;
}

nav a:hover::after{
  width:100%;
}

/* ===== HERO ===== */
.hero{
  min-height:100vh;
  max-width:1200px;
  margin:auto;
  padding:140px 20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:50px;
  position:relative;
  z-index:2;
}

/* TEXT */
.hero h1{
  font-size:3.5rem;
  letter-spacing:-1px;
}

.hero h1 span{
  background:linear-gradient(90deg,#60a5fa,#34d399);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero h2{
  margin:12px 0;
  color:#60a5fa;
  font-weight:500;
}

.hero p{
  color:var(--muted);
  line-height:1.8;
  font-size:1.05rem;
  max-width:550px;
}

/* BUTTONS */
.btns{
  margin-top:25px;
}

.btn{
  display:inline-block;
  padding:14px 28px;
  border-radius:12px;
  text-decoration:none;
  margin-right:12px;
  transition:0.3s;
  font-weight:600;
  border:none;
  cursor:pointer;
}

.primary{
  background:linear-gradient(135deg,#60a5fa,#34d399);
  color:#020617;
  box-shadow:0 10px 30px rgba(96,165,250,0.25);
}

.primary:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 40px rgba(96,165,250,0.35);
}

.outline{
  border:1px solid rgba(96,165,250,0.4);
  color:#60a5fa;
  background:transparent;
}

.outline:hover{
  background:#60a5fa;
  color:#020617;
}

/* IMAGE */
.hero img{
  width:100%;
  max-width:380px;
  border-radius:22px;
  justify-self:end;
  transition:0.4s;
  box-shadow:0 25px 60px rgba(96,165,250,0.2);
  z-index:2;
}

.hero img:hover{
  transform:rotateY(8deg) scale(1.05);
}

/* TYPEWRITER */
.type{
  border-right:2px solid #60a5fa;
  white-space:nowrap;
  overflow:hidden;
  width:0;
  animation:typing 3s steps(20,end) forwards, blink 0.7s infinite;
}

@keyframes typing{
  to{width:100%}
}

@keyframes blink{
  50%{border-color:transparent}
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
}

.modal-content{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  padding:30px;
  border-radius:16px;
  width:90%;
  max-width:400px;
  text-align:center;
  animation:scaleIn .4s ease;
}

.modal-content p{
  color:var(--muted);
}

.modal-content a{
  display:block;
  margin:12px 0;
  padding:12px;
  border-radius:10px;
  background:linear-gradient(135deg,#60a5fa,#34d399);
  color:#020617;
  text-decoration:none;
}

/* RESPONSIVE */
@media(max-width:900px){
  .hero{
    grid-template-columns:1fr;
    text-align:center;
  }

  .hero img{
    justify-self:center;
  }
}

/* ANIMATION */
@keyframes scaleIn{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<!-- CURSOR LIGHT -->
<div class="cursor-light" id="cursor"></div>

<!-- BACKGROUND -->
<div class="bg">
  <span></span>
  <span></span>
</div>

<!-- NAV -->
<header>
  <nav>
    <h3>Shoaib</h3>
    <div>
      <a href="skills.html">Skills</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
      <a href="experience.html">Experience</a>
      <a href="education.html">Education</a>
    </div>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>Hi, I'm <span>Shoaib</span></h1>
    <h2 class="type">MERN Stack Developer</h2>
    <p>
      Results-driven Full Stack Developer with experience in building scalable web applications, APIs, and AI systems.
    </p>

    <div class="btns">
      <a href="projects.html" class="btn primary">View Projects</a>
      <button class="btn outline" onclick="openCV()">Download CV</button>
    </div>
  </div>

  <img src="Muhammad Shoaib saeed.png" alt="Shoaib">
</section>

<!-- MODAL -->
<div class="modal" id="cvModal">
  <div class="modal-content">
    <h3>Download CV</h3>
    <p>Choose format</p>
    <a href="assets/Shoaib-CV.pdf" download>Download PDF</a>
    <button onclick="closeCV()" class="btn outline">Cancel</button>
  </div>
</div>

<script>
function openCV(){
  document.getElementById("cvModal").style.display="flex";
}

function closeCV(){
  document.getElementById("cvModal").style.display="none";
}

/* CURSOR LIGHT MOVEMENT */
const cursor = document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});
</script>

</body>
</html>
