<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Shoaib</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f172a;
  --card:rgba(255,255,255,0.04);
  --text:#e5e7eb;
  --muted:#94a3b8;

  --primary:#a78bfa;   /* violet */
  --secondary:#22c55e; /* soft green */
  --border:rgba(255,255,255,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Inter;
  background:linear-gradient(to bottom,#020617,#0f172a);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* SOFT BACKGROUND GLOW */
body::before{
  content:"";
  position:fixed;
  width:350px;
  height:350px;
  background:radial-gradient(circle, rgba(167,139,250,0.15), transparent 70%);
  filter:blur(120px);
  top:-100px;
  right:-100px;
}

/* CONTAINER */
.container{
  width:100%;
  max-width:700px;
  padding:40px 20px;
}

/* HEADING */
h2{
  font-size:38px;
  margin-bottom:10px;
}

.subtitle{
  color:var(--muted);
  margin-bottom:30px;
  font-size:16px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  padding:28px;
  border-radius:16px;
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

/* INPUTS */
input, textarea{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  color:#fff;
  font-size:15px;
  border:1px solid transparent;
  transition:.3s;
}

input:focus, textarea:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(167,139,250,0.2);
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--primary),#818cf8);
  color:#020617;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(167,139,250,0.3);
}

button.loading{
  opacity:0.7;
  pointer-events:none;
}

/* SUCCESS */
.success{
  text-align:center;
  margin-top:15px;
  color:var(--secondary);
  display:none;
  font-size:14px;
}

/* LINKS */
.links{
  margin-top:25px;
  display:flex;
  flex-wrap:wrap;
  gap:15px;
}

.links a{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:8px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  transition:.3s;
}

.links a:hover{
  background:var(--primary);
  color:#020617;
}

/* MOBILE */
@media(max-width:500px){
  h2{font-size:28px;}
}
</style>
</head>

<body>

<div class="container">
  <h2>Let's Connect</h2>
  <p class="subtitle">Have a project or idea? Send me a message directly.</p>

  <div class="card">
    <form id="contact-form">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
      <button id="btn">Send via WhatsApp</button>
    </form>

    <div class="success" id="successMsg">Opening WhatsApp... ✅</div>

    <div class="links">
      <a href="mailto:saeedshoaib888@gmail.com">📧 Email</a>
      <a href="https://github.com/ShoaibSaeed123" target="_blank">💻 GitHub</a>
      <a href="https://linkedin.com/in/muhammad-shoaib-saeed" target="_blank">🔗 LinkedIn</a>
    </div>
  </div>
</div>

<script>
document.getElementById("contact-form").addEventListener("submit", function(e){
  e.preventDefault();

  let btn = document.getElementById("btn");
  let success = document.getElementById("successMsg");

  btn.classList.add("loading");
  btn.innerText = "Processing...";

  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let message = document.getElementById("message").value;

  let phone = "923054449606";

  let text = `🚀 New Message%0A%0A👤 Name: ${name}%0A📧 Email: ${email}%0A💬 Message: ${message}`;

  let url = `https://wa.me/${phone}?text=${text}`;

  setTimeout(()=>{
    window.open(url, "_blank");

    btn.classList.remove("loading");
    btn.innerText = "Send via WhatsApp";
    success.style.display = "block";
  }, 700);
});
</script>

</body>
</html>
